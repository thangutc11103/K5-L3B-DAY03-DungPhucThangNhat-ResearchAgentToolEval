[client]
# Hide the "Deploy" button and developer menu items in the top-right toolbar.
toolbarMode = "minimal"

[theme]
# Dark, neutral palette similar to ChatGPT.
base = "dark"
primaryColor = "#ececec"
backgroundColor = "#212121"
secondaryBackgroundColor = "#2f2f2f"
textColor = "#ececec"
font = "sans serif"

[theme.sidebar]
backgroundColor = "#171717"
secondaryBackgroundColor = "#2a2a2a"
